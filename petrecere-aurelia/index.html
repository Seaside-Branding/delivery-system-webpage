    <script>
        const analyticsCookieKey = 'seaside_analytics_consent';
        const analyticsMeasurementId = 'G-JHWR7XVT1R';

        function getAnalyticsConsent() {
            return localStorage.getItem(analyticsCookieKey);
        }

        function saveAnalyticsConsent(value) {
            localStorage.setItem(analyticsCookieKey, value);
            if (value === 'accepted') {
                enableAnalytics();
            }
        }

        function enableAnalytics() {
            if (window.analyticsEnabled) return;
            window.analyticsEnabled = true;
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', analyticsMeasurementId);
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + analyticsMeasurementId;
            document.head.appendChild(script);
        }

        function updateAnalyticsBanner() {
            const banner = document.getElementById('cookie-consent-banner');
            if (!banner) return;
            const consent = getAnalyticsConsent();
            banner.classList.toggle('hidden', consent === 'accepted' || consent === 'declined');
        }

        function handleAnalyticsAccept() {
            saveAnalyticsConsent('accepted');
            updateAnalyticsBanner();
        }

        function handleAnalyticsDecline() {
            saveAnalyticsConsent('declined');
            updateAnalyticsBanner();
        }

        function applyAnalyticsConsent() {
            const consent = getAnalyticsConsent();
            if (consent === 'accepted') {
                enableAnalytics();
            }
            updateAnalyticsBanner();
        }

        document.addEventListener('DOMContentLoaded', applyAnalyticsConsent);
    </script>

        </div>
        <div class="cookie-banner-actions">
            <button type="button" onclick="handleAnalyticsDecline()">Decline</button>
            <button type="button" onclick="handleAnalyticsAccept()" class="btn-primary">Accept</button>
        </div>
    </div>
