        body { background: var(--bg); color: var(--text); font-family: var(--body-font); overflow-x: hidden; text-align: center; margin: 0; }

        @media (min-width: 768px) { .masonry { columns: 3; padding: 4rem; } }
        .item { break-inside: avoid; margin-bottom: var(--item-gap); border-radius: 8px; overflow: hidden; background: #111; }
        .item img { width: 100%; height: auto; display: block; transition: transform 0.5s ease; }
        .item:hover img { transform: scale(1.05); }
        .btn-primary { 
            background: var(--accent); 
            color: var(--button-text); 
            text-decoration: none !important; 
            font-weight: 900; 
            border-radius: 12px; 
            display: inline-block; 
            transition: all 0.3s ease; 
            cursor: pointer; 
            border: none; 
            font-family: var(--button-font);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .download-cta {

            padding-inline: var(--button-pad-x);
            padding-block: var(--button-pad-y);
            text-transform: none;
        }
        .title-heading {

            width: min(100%, 16ch) !important;

            margin-left: auto !important;
            margin-right: auto !important;
            overflow-wrap: anywhere !important;

        .title-heading b,

        .details {

    <script>
        const analyticsCookieKey = 'seaside_analytics_consent';
        const analyticsMeasurementId = 'G-JHWR7XVT1R';

        function getAnalyticsConsent() {
            return localStorage.getItem(analyticsCookieKey);
        }

        function saveAnalyticsConsent(value) {
            localStorage.setItem(analyticsCookieKey, value);
            if (value === 'accepted') {
                enableAnalytics();
            }
        }

        function enableAnalytics() {
            if (window.analyticsEnabled) return;
            window.analyticsEnabled = true;
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            window.gtag = gtag;
            gtag('js', new Date());
            gtag('config', analyticsMeasurementId);
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=' + analyticsMeasurementId;
            document.head.appendChild(script);
        }

        function updateAnalyticsBanner() {
            const banner = document.getElementById('cookie-consent-banner');
            if (!banner) return;
            const consent = getAnalyticsConsent();
            banner.classList.toggle('hidden', consent === 'accepted' || consent === 'declined');
        }

        function handleAnalyticsAccept() {
            saveAnalyticsConsent('accepted');
            updateAnalyticsBanner();
        }

        function handleAnalyticsDecline() {
            saveAnalyticsConsent('declined');
            updateAnalyticsBanner();
        }

        function applyAnalyticsConsent() {
            const consent = getAnalyticsConsent();
            if (consent === 'accepted') {
                enableAnalytics();
            }
            updateAnalyticsBanner();
        }

        document.addEventListener('DOMContentLoaded', applyAnalyticsConsent);
    </script>

        </div>
        <div class="cookie-banner-actions">
            <button type="button" onclick="handleAnalyticsDecline()">Decline</button>
            <button type="button" onclick="handleAnalyticsAccept()" class="btn-primary">Accept</button>

    <script type="module">
        import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe-lightbox.esm.min.js';
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            pswpModule: () => import('https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.2/photoswipe.esm.min.js')
        });
        
        lightbox.on('uiRegister', function() {
            lightbox.pswp.ui.registerElement({
                name: 'download-button',
                order: 8,
                isPrimary: true,
                tagName: 'a',
                html: '<svg aria-hidden="true" class="pswp__icn" viewBox="0 0 32 32" width="32" height="32"><path d="M20.5 14.3 17.1 18V10h-2.2v7.9l-3.4-3.6L10 15.8l6 6.2 6-6.2Z" fill="currentColor"/><path d="M24 24H8v-2h16Z" fill="currentColor"/></svg>',
                onInit: (el, pswp) => {
                    el.setAttribute('download', '');
                    el.setAttribute('target', '_blank');
                    pswp.on('change', () => {
                        el.href = pswp.currSlide.data.src;
                    });
                }
            });
        });

        lightbox.init();
    </script>
